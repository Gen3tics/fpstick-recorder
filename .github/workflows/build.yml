# Tests on every push, and a Windows build to download from the run's page.
name: build

# Only on pushes to this repository itself: a pull request from someone's fork does not start it.
on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: |
          rustc --version
          cargo test --manifest-path framedata/Cargo.toml
          cargo test
      - name: Build
        run: cargo build --release
      - name: The folder people get, zipped (as the release makes it)
        shell: pwsh
        run: ./packaging/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: recorder-windows
          path: |
            target/release/recorder.exe
            FPStick-Recorder.zip
            FPStick-Recorder.zip.sha256
          if-no-files-found: error
          retention-days: 30
