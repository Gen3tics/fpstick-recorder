# The download. Started by hand on GitHub (Actions, "release", Run workflow) or by pushing a version tag (v0.1.0):
# GitHub builds the recorder from this code, puts Intel's PresentMon beside it (the one file, checked by its hash
# and by Intel's signature), and attaches the zip to a release named after the version in Cargo.toml. Nobody's own
# PC is part of it.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The release is named after the program's version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) { throw "The tag is $env:GITHUB_REF_NAME but Cargo.toml says $version" }
          "RELEASE=v$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Tests
        run: |
          rustc --version
          cargo test --manifest-path framedata/Cargo.toml
          cargo test
      - name: Build
        run: cargo build --release
      - name: The folder people get, zipped
        shell: pwsh
        run: ./packaging/package.ps1
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "FPStick Recorder $env:RELEASE, built by GitHub from this repository's code at commit $env:GITHUB_SHA.`n`nUnpack the zip and start **FPStick Recorder**. The guide: https://fpstick.com/guide`n`nIntel's PresentMon 2.6.0 is included unchanged, checked by its hash and Intel's signature when this was built. The download is not signed, so Windows warns before running it the first time."
          gh release create $env:RELEASE FPStick-Recorder.zip FPStick-Recorder.zip.sha256 --target $env:GITHUB_SHA --title "FPStick Recorder $env:RELEASE" --notes $notes
